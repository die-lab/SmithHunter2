# Single environment with every tool, for running without --software-deployment-method conda.
# Python is capped below 3.14: with 3.14 the solver falls back to IntaRNA 1.x and ViennaRNA 2.4
# (Python 2.7 builds). Dry solve (mamba env create --dry-run) on 2026-11-09 gives Python 3.13,
# IntaRNA 3.4.1, RNAhybrid 2.1.2 and ViennaRNA 2.7.2.
name: smithhunter2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.14
  - snakemake-minimal>=8
  - fastp=0.23.4
  - bowtie=1.3.1
  - pytest
  # module B
  - intarna>=3.4
  - rnahybrid>=2.1.2
  - viennarna>=2.6
