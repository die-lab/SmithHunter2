# RNA tools for module B. Kept apart from environment.yml: with recent Python the solver
# falls back to IntaRNA 1.x and ViennaRNA 2.4 (Python 2.7 builds) in a shared env.
# Create once: mamba env create -n smithhunter2-rna -f workflow/envs/rna.yaml
channels:
  - conda-forge
  - bioconda
dependencies:
  - intarna>=3.4
  - rnahybrid>=2.1.2
  - viennarna>=2.6
