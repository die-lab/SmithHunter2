# RNA tools for module B rules run with --software-deployment-method conda.
# The same tools are in environment.yml (single environment, Python < 3.14).
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.14   # the rules also run `python -m smithhunter`
  - intarna>=3.4
  - rnahybrid>=2.1.2
  - viennarna>=2.6
