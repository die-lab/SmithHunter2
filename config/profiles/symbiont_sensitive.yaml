# Profile for a symbiont at low load (well below 1% of the library), or to recover more known
# small RNAs. Add after the main config:
#   snakemake -s workflow/Snakefile --configfile config/config.yaml config/profiles/symbiont_sensitive.yaml ...
# As symbiont_precise.yaml with a lower library threshold. Evidence (docs/module_a_benchmarks.md,
# section 8): spider mite (Wolbachia 0.35% of the reads) 2 WsnRNA loci instead of 1, all 11
# Chlamydia sRNAs instead of 8, no false positive in five of six clean negative controls. Costs:
# in a high-load study (JW18, Wolbachia 20%) one locus passes in the cured line (cross-talk of the
# most abundant Wolbachia small RNA), and candidates double or triple (JW18 3,694; Chlamydia 3,566).
# With pools that differ (sexes, tissues) add loci.min_samples_scope: group and a `group` column.
loci:
  exclude_structural: any
  min_exact_fraction: 0.5
  min_rpm_genome: 0
  min_rpm: 2
