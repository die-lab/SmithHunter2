# SmithHunter2 configuration. Paths are relative to the directory snakemake runs in.

samples: config/samples.tsv   # TSV: sample, fq1, fq2 (fq2 empty for single-end)
outdir: results
threads: 8

# Every genome present in the sample. The combined reference holds all of them, so
# each read is assigned to the genome it aligns to best.
#   role: focus    -> loci are defined, annotated and passed to target prediction
#   role: exclude  -> the genome only competes for reads; its reads are counted, then dropped
#   topology: circular -> reads across the origin are handled automatically
#   length: [min, max] -> read length range for this genome (default: trimming range)
#   targets: ago | bacterial | none -> old per-genome field: read as 'all target sets of that mode'
#                                       (prefer `target_sets: [...]` below)
genomes:
  mito:
    fasta: data/organism_mt.fasta
    role: focus
    topology: circular
    annotation: data/organism_mt.gff3   # optional, e.g. from MITOS2
    targets: ago
  nuclear:
    fasta: data/organism_nuc.fasta
    role: exclude
  # symbiont:
  #   fasta: data/symbiont.fasta
  #   role: focus
  #   topology: circular
  #   length: [18, 40]
  #   target_sets: [symbiont_mrna]   # its small RNAs are tested against bacterial mRNAs (see below)

# Reads aligning equally well to more than one genome, at least one of them focus:
#   discard -> dropped; report -> listed in origin tables, not used for loci;
#   split   -> the read is shared among all its best alignments
ambiguous: report

# Which genome a read is given to when it fits a focus genome and another genome.
# Mismatches are compared genome by genome (best alignment of the read in each genome).
#   best   -> (default) fewer mismatches wins; a tie is a double-mapping read, handled by
#             `ambiguous` above
#   severe -> as best, but a tie is always discarded (class `ambiguous`, no hits kept)
#   evil   -> as severe, and a read is also discarded (class `evil_rejected`) when it fits an
#             exclude genome at most `evil_max_diff` mismatches WORSE than its best focus
#             alignment (mismatches on the exclude genome minus mismatches on the focus genome,
#             1..evil_max_diff). Must be <= mapping.mismatches. 0 = same as severe.
assignment:
  mode: best
  evil_max_diff: 1       # only used by evil

trimming:
  adapter_r1: TGGAATTCTCGGGTGCCAAGG          # empty -> fastp autodetection
  adapter_r2: GATCGTCGGACTGTAGAACTCTGAAC     # paired-end only
  min_length: 18
  max_length: 35
  extra: ""                                  # extra fastp arguments

mapping:
  mismatches: 1      # bowtie -v
  max_hits: 50       # reads with more equally best alignments are set aside

loci:
  merge_gap: 0           # join alignments closer than this many bases into one block
  peaks: true            # split blocks at 5' end peaks (false: one locus per block)
  peak_window: 2         # reads starting within this many bases of a peak belong to it
  peak_pvalue: 0.001     # Poisson test of a peak against the local background
  background_flank: 50   # bases on each side used to estimate the background
  satellite_distance: 10 # a weak peak this close to a stronger one ...
  satellite_fraction: 0.1  # ... with less than this share of its reads joins it
  multimap: fractional   # fractional | unique (within one genome)
  min_rpm: 5             # reads per million (library total) in one sample
  min_count: 5           # and at least this many reads in that sample
  min_samples: null      # samples that must reach min_rpm; null -> number of samples - 1

ends:
  n_thre: 0.5            # fraction of reads used to find the dominant end positions
  penalty: 0.1
  # How the 5' end is tested (the 3' end always uses the score):
  #   dominant -> (default) share of the locus reads starting at its top 5' position
  #               must be >= min_five_fraction
  #   jitter   -> share of the reads starting within five_jitter nt of the top position
  #               must be >= min_five_fraction (tolerates 5' ends shifted by 1-2 nt)
  #   score    -> five_score > min_five_score (with 0.5 the same loci pass as dominant
  #               with min_five_fraction = n_thre)
  five_filter: dominant
  min_five_fraction: 0.5
  five_jitter: 1
  min_five_score: 0.5    # score only: pass if five_score > this
  min_three_score: 0.0   # pass if three_score >= this
  min_isolation: 0.5     # and if this share of the reads starting near the peak are its own

# ---------------------------------------------------------------------------------------
# Module B (target prediction): snakemake -s workflow/Snakefile --cores 8 targets
# Every target set is checked with the general seed-based logic; `mode: bacterial` is
# opt-in (see the commented example below). A focus genome is tested against the sets listed in its
# `target_sets` (e.g. `target_sets: [host]`), or against all sets when it lists none.
target_sets:
  host:
    genome: data/organism_nuc.fasta          # genome + GFF3 (spliced, strand-aware) ...
    annotation: data/organism_nuc.gff3
    # transcripts: data/transcripts.fasta    # ... or transcripts, with an optional
    # region_table: data/regions.tsv         # table: transcript, region, start, end (1-based)
    regions: [three_prime_UTR]               # also: five_prime_UTR, CDS, transcript
    whole_transcript_if_no_utr: false
    # Per-set overrides of the scoring options of `targets` below (predictors, support_from,
    # intarna_prefilter, prefilter_keep_classes, ...), e.g. predictors: [intarna]
  # Bacterial mode (bacterial small RNA -> bacterial mRNA, e.g. Hfq-dependent sRNAs): IntaRNA over
  # a window around the start codon of every CDS, no seed position, no RNAhybrid.
  # symbiont_mrna:
  #   mode: bacterial
  #   genome: data/symbiont.fasta
  #   annotation: data/symbiont.gff3       # GFF3 with CDS features (NCBI, Prokka, Bakta, ...)
  #   window: [-200, 100]                  # relative to the start codon (A of AUG = +1)
  #   topology: circular                   # windows continue across the origin (default: linear,
  #                                        # windows are cut at contig ends)
  #   # circular_contigs: [chr1]           # or name the circular contigs (replaces topology)
  #   seed_bp: 7                           # IntaRNA seed, any position; 6-7 usual
  #   # no_seed: true                      # no seed requirement at all
  #   # acc_window: 150                    # IntaRNA --tAccW / --tAccL (local accessibility)
  #   # acc_length: 100
  #   temperature: 30                      # growth temperature of the study (default: targets.temperature)

targets:
  candidates: results/discovery/candidates.fasta   # edit a copy to review candidates
  seed: [2, 8]                                     # guide positions; v0 used [4, 10]
  decoys: 20                                       # dinucleotide-shuffled decoys each
  decoy_mode: shuffle                              # or match_seed_gc / keep_seed (see README)
  # Predictors COMPUTED. Not set = by mode: ago -> intarna + rnahybrid, bacterial -> intarna only,
  # cross-kingdom -> both (the last one only through `score-sites --mode`). [] = seed sites only.
  # A skipped predictor costs nothing and its columns stay empty. See README "Choosing and
  # ignoring predictors".
  # predictors: [intarna, rnahybrid]
  # Predictors that COUNT when calling sites (default: all computed). A predictor listed in
  # `predictors` but not here is reported but ignored. Calls are the union: a site is called
  # when ANY counted predictor has q <= fdr, `called_by` says which, `best_q` is the smallest q.
  # support_from: [intarna, rnahybrid]
  score_weak_sites: false                          # also score 6mer / offset-6mer (many more runs)
  temperature: 37                                  # deg C for IntaRNA: SET IT for your organism (not set = 37 with a warning)
  calibrate_samples: 1000                          # RNAcalibrate sample size per small RNA (0: preset)
  intarna_prefilter: 1.0                           # <1: IntaRNA only on this best share of sites by RNAhybrid MFE.
  #                                                  RISK: IntaRNA-only candidates are lost (see README); do not
  #                                                  use it when IntaRNA suits the data better. Cost: prefilter_summary.tsv
  prefilter_by: rnahybrid                          # the cheap predictor that decides what IntaRNA sees
  prefilter_keep_classes: [8mer]                   # classes IntaRNA always scores in full despite the prefilter
  rnahybrid_batch: 2000                            # sites per RNAhybrid process (0: one per site); same numbers
  intarna_batch: 50                                # windows per IntaRNA process (0: one per site); same numbers
  fdr: 0.05                                        # q-value threshold for "support"
